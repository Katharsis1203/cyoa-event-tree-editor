<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Tree Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="editor">
    <h1>Event Tree Editor</h1>

    <label for="filename-input" title="Choose a name for your story event file">Filename:</label>
    <input type="text" id="filename-input" placeholder="e.g. crossroad-events" />

    <div id="tree-container" class="node-container"></div>
    <button id="add-root">Add Root Node</button>
    <button id="export">Export JSON</button>
  </div>

  <template id="node-template">
    <div class="node">
      <label>Node ID: <input type="text" class="node-id" /></label>
      <label>Title: <input type="text" class="node-title" /></label>
      <label>Text: <textarea class="node-text"></textarea></label>
      <label title="Optional image to display during this event. Use a full URL or filename.">
        Image (optional): <input type="text" class="node-image" />
      </label>
      <div class="choices"></div>
      <button class="add-choice">Add Choice</button>
    </div>
  </template>

  <template id="choice-template">
    <div class="choice">
      <label>Choice Text: <input type="text" class="choice-text" /></label>
      <label title="The ID of the node this choice leads to (if not defined via child node)">
        Next Node ID: <input type="text" class="choice-next" />
      </label>
      <button class="add-child-node">Describe Node</button>
      <div class="child-container"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
