<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Event Tree Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="editor">
    <h1>Event Tree Editor</h1>
    <div id="tree-container" class="node-container"></div>
    <button id="add-root">Add Root Node</button>
    <button id="export">Export JSON</button>
  </div>

  <!-- Node Template -->
  <template id="node-template">
    <div class="node">
      <label title="Unique ID for this event node. Example: 'Town1.0' or '1.2'">
        Node ID: <input type="text" class="node-id" />
      </label>
      <label title="Optional short title for internal organization or display">
        Title: <input type="text" class="node-title" />
      </label>
      <label title="The main text that appears during this event">
        Text: <textarea class="node-text"></textarea>
      </label>
      <div class="choices"></div>
      <button class="add-choice">Add Choice</button>
    </div>
  </template>

  <!-- Choice Template -->
  <template id="choice-template">
    <div class="choice">
      <label title="What the player sees as the clickable choice">
        Choice Text: <input type="text" class="choice-text" />
      </label>
      <label title="ID of the node this choice leads to. Must match another Node ID.">
        Destination Node ID: <input type="text" class="choice-next" />
      </label>
      <button class="add-child-node" style="display: none;">Describe Destination Node</button>
      <div class="child-container"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
